name: Scanner tests
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.repository == '0857ken/tw-market-scanner' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node scripts/audit-built.mjs
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Save browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: scanner-browser-acceptance
          path: |
            test-results/*.png
            test-results/stage3d-*.json
          retention-days: 1
          if-no-files-found: warn
