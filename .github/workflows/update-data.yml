name: Official EOD data
on:
  # Scheduling requires a separate owner-approved change.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: independent-scanner-data
  cancel-in-progress: false
jobs:
  update:
    # Default OFF. Standard public runners only; never write to another repository or main.
    if: github.repository == '0857ken/tw-market-scanner' && github.event.repository.private == false && github.ref == 'refs/heads/main' && vars.DATA_UPDATES_APPROVED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Synchronize latest data branch before reading history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git ls-remote --exit-code --heads origin market-data >/dev/null 2>&1; then
            git fetch origin market-data
            git switch -C market-data origin/market-data
            git merge --no-edit origin/main
          else
            git switch -c market-data origin/main
          fi
      - name: Fetch and validate official observations
        id: fetch
        run: |
          set +e
          python -m pipeline.run --strict
          result=$?
          set -e
          echo "result=$result" >> "$GITHUB_OUTPUT"
          cat data/quality.json >> "$GITHUB_STEP_SUMMARY"
          # Persist the explicit quality state even on failure; a separate step fails the job.
      - name: Commit only source observations and quality state
        run: |
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: official EOD observations and quality state"
            git push origin HEAD:market-data
          fi
      - name: Fail visibly when critical data are stale or missing
        if: steps.fetch.outputs.result != '0'
        run: |
          echo 'Critical data freshness/availability failed. Original dates retained. No website deployment.'
          exit 1
