# Stage 4C-2B: only a verified successful pointer can seed manual acquisition.
name: Daily observation data - isolated dry-run
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: Original intended completed TWSE/TPEx session (YYYY-MM-DD)
        required: true
        type: string
      expected_zip_sha256:
        description: Exact successful published ZIP SHA256 (no latest or fixture fallback)
        required: true
        type: string
      expected_generation:
        description: Exact successful generation
        required: true
        type: number
      intended_slot:
        description: Original manual slot identifier, retained across delayed runs
        required: true
        type: string
      deadline:
        description: Original slot deadline with timezone, ISO8601
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: scanner-daily-candidate
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == '0857ken/tw-market-scanner' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Acquire licensed current snapshots in isolation
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_ZIP: ${{ inputs.expected_zip_sha256 }}
          EXPECTED_GENERATION: ${{ inputs.expected_generation }}
          INTENDED_SLOT: ${{ inputs.intended_slot }}
          SLOT_DEADLINE: ${{ inputs.deadline }}
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline.verified_baseline --output test-results/stage4c1-current --target-date "$TARGET_DATE" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --expected-zip-sha256 "$EXPECTED_ZIP" --expected-generation "$EXPECTED_GENERATION" --slot "$INTENDED_SLOT" --deadline "$SLOT_DEADLINE" --fetch-current
      - name: Save candidate or failure evidence; never publish
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: daily-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/stage4c1-current/
          retention-days: 7
          if-no-files-found: error
      - name: Actionable failure summary
        if: failure()
        run: |
          echo 'Daily source/gate failed. No data branch or production site was modified. Inspect failure.json and update-attempt.json. Do not retry official 403/429 or accept revisions automatically.' >> "$GITHUB_STEP_SUMMARY"
