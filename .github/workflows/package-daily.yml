# Separate packaging rehearsal. There is deliberately no Pages deploy job.
name: Daily observation package - publication disabled
on:
  workflow_dispatch:
    inputs:
      data_run:
        description: Successful isolated update run ID
        required: true
        type: string
      data_attempt:
        description: Exact source run attempt
        required: true
        type: string
      seed_run:
        description: CI run containing reviewed fixed frontend seed
        required: true
        type: string
      seed_zip_sha256:
        description: Exact reviewed daily-preview.zip SHA256
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: scanner-daily-package
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == '0857ken/tw-market-scanner' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify upstream workflow identity and exact code revision
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_RUN: ${{ inputs.data_run }}
          DATA_ATTEMPT: ${{ inputs.data_attempt }}
          SEED_RUN: ${{ inputs.seed_run }}
          SEED_SHA: ${{ inputs.seed_zip_sha256 }}
        run: |
          python - <<'PY'
          import os,re
          for k in ('DATA_RUN','DATA_ATTEMPT','SEED_RUN'):assert re.fullmatch('[0-9]+',os.environ[k])
          assert re.fullmatch('[a-f0-9]{64}',os.environ['SEED_SHA'])
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DATA_RUN/attempts/$DATA_ATTEMPT" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SEED_RUN" > seed-run.json
          python - <<'PY'
          import json,os
          for filename,path in [('source-run.json','.github/workflows/update-data.yml'),('seed-run.json','.github/workflows/ci.yml')]:
              r=json.load(open(filename));assert r['conclusion']=='success' and r['status']=='completed'
              assert r['path']==path and r['head_sha']==os.environ['GITHUB_SHA']
              assert r['repository']['full_name']=='0857ken/tw-market-scanner'
          assert json.load(open('source-run.json'))['run_attempt']==int(os.environ['DATA_ATTEMPT'])
          PY
          gh run download "$DATA_RUN" --repo "$GITHUB_REPOSITORY" --name "daily-observation-$DATA_RUN-$DATA_ATTEMPT" --dir candidate
          gh run download "$SEED_RUN" --repo "$GITHUB_REPOSITORY" --name stage4c1-dry-run --dir seed
      - name: Package independently gated data with unchanged frontend bytes
        env:
          SEED_SHA: ${{ inputs.seed_zip_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          from pipeline.package_daily import package
          from pipeline.github_transport import GitHubAPI
          from pipeline.persistent_state import StateStore,GitHubState
          from pipeline.release_archive import ReleaseArchive,GitHubReleases
          from pipeline.live_verification import LiveVerifier
          from pipeline.verified_baseline import load_verified_baseline
          seeds=list(Path('seed').rglob('daily-preview.zip'));assert len(seeds)==1
          gate=json.load(open('candidate/gate.json'));binding=gate['baselineBinding']
          api=GitHubAPI(os.environ['GH_TOKEN'])
          baseline=load_verified_baseline(StateStore(GitHubState(api)),ReleaseArchive(GitHubReleases(api)),LiveVerifier(),binding['publishedZipSha256'],binding['generation'])
          source=json.load(open('source-run.json'))
          provenance={'sourceRunId':str(source['id']),'runAttempt':source['run_attempt'],'workflowPath':source['path'],'status':source['status'],'conclusion':source['conclusion'],'codeSha':source['head_sha'],'processorCommit':source['head_sha']}
          package('candidate',seeds[0],os.environ['SEED_SHA'],'test-results/stage4c1-package',baseline=baseline,slot=gate['intendedSlot'],provenance=provenance)
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: daily-package-${{ github.run_id }}
          path: test-results/stage4c1-package/
          retention-days: 7
          if-no-files-found: error
